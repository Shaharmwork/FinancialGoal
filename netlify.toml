# Static export of the Next.js app (see next.config.mjs: output: 'export').
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Only these two public values are needed in Netlify's environment settings:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
# Server-only alert credentials go in Netlify environment settings, never NEXT_PUBLIC_*:
#   SUPABASE_SERVICE_ROLE_KEY
#   ALERT_SMTP_PASSWORD (Gmail app password)
# Keep these out of client code and netlify.toml.

[functions."registration-alerts"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
